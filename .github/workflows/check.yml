name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Xcode 27 preview image: matches the local toolchain (Xcode 27.2 / Swift 6.4).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - run: swift --version
      - run: make check
